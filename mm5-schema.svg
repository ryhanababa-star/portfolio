<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Inter, Arial, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0b2545">File d'attente M/M/5 : gestion des sinistres automobiles</text>
  <text x="40" y="70" font-size="14" fill="#4f6480">Schéma du système modélisé (arrivées et durées de traitement exponentielles, 5 gestionnaires)</text>

  <!-- Arrivées -->
  <g>
    <rect x="40" y="170" width="150" height="84" rx="10" fill="#eef5fc" stroke="#5fb3f0" stroke-width="2"/>
    <text x="115" y="204" font-size="15" font-weight="700" fill="#0b2545" text-anchor="middle">Déclarations</text>
    <text x="115" y="228" font-size="14" fill="#1f7fc4" text-anchor="middle">15 sinistres / jour</text>
  </g>
  <path d="M190 212 H238" stroke="#0b2545" stroke-width="2.5" marker-end="url(#a)"/>

  <!-- File -->
  <g>
    <rect x="245" y="182" width="170" height="60" rx="8" fill="#ffffff" stroke="#0b2545" stroke-width="2"/>
    <g fill="#5fb3f0">
      <rect x="262" y="196" width="22" height="32" rx="4"/>
      <rect x="292" y="196" width="22" height="32" rx="4"/>
      <rect x="322" y="196" width="22" height="32" rx="4"/>
      <rect x="352" y="196" width="22" height="32" rx="4" opacity="0.5"/>
      <rect x="382" y="196" width="22" height="32" rx="4" opacity="0.25"/>
    </g>
    <text x="330" y="270" font-size="14" fill="#4f6480" text-anchor="middle">File d'attente</text>
  </g>

  <!-- Vers serveurs -->
  <g stroke="#0b2545" stroke-width="2" fill="none">
    <path d="M415 212 C 470 212, 470 112, 520 112" marker-end="url(#a)"/>
    <path d="M415 212 C 470 212, 470 162, 520 162" marker-end="url(#a)"/>
    <path d="M415 212 H 518" marker-end="url(#a)"/>
    <path d="M415 212 C 470 212, 470 262, 520 262" marker-end="url(#a)"/>
    <path d="M415 212 C 470 212, 470 312, 520 312" marker-end="url(#a)"/>
  </g>

  <!-- 5 serveurs -->
  <g font-size="14" font-weight="600" text-anchor="middle">
    <circle cx="548" cy="112" r="22" fill="#0b2545"/><text x="548" y="117" fill="#ffffff">1</text>
    <circle cx="548" cy="162" r="22" fill="#0b2545"/><text x="548" y="167" fill="#ffffff">2</text>
    <circle cx="548" cy="212" r="22" fill="#0b2545"/><text x="548" y="217" fill="#ffffff">3</text>
    <circle cx="548" cy="262" r="22" fill="#0b2545"/><text x="548" y="267" fill="#ffffff">4</text>
    <circle cx="548" cy="312" r="22" fill="#0b2545"/><text x="548" y="317" fill="#ffffff">5</text>
  </g>
  <text x="548" y="360" font-size="14" fill="#4f6480" text-anchor="middle">5 gestionnaires</text>

  <!-- Résultats -->
  <g>
    <rect x="640" y="120" width="220" height="80" rx="10" fill="#0b2545"/>
    <text x="750" y="160" font-size="30" font-weight="800" fill="#5fb3f0" text-anchor="middle">76,4 %</text>
    <text x="750" y="185" font-size="13" fill="#ffffff" text-anchor="middle">de prise en charge immédiate</text>
    <rect x="640" y="222" width="220" height="80" rx="10" fill="#0b2545"/>
    <text x="750" y="262" font-size="30" font-weight="800" fill="#5fb3f0" text-anchor="middle">34 min</text>
    <text x="750" y="287" font-size="13" fill="#ffffff" text-anchor="middle">de délai moyen d'attente</text>
  </g>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#0b2545"/>
    </marker>
  </defs>
</svg>
